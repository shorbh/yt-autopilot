name: Produce & schedule weekly videos

on:
  schedule:
    # Every Monday 06:00 UTC -> long video publishes 2 PM ET same day, Shorts on Tue/Thu/Sat
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      topic:
        description: "Force a topic (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Produce
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # On the schedule trigger `inputs` is empty, so these are "" and both branches below are skipped.
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_TOPIC: ${{ inputs.topic }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run --keep-build); fi
          if [ -n "$FORCE_TOPIC" ]; then ARGS+=(--topic "$FORCE_TOPIC"); fi
          python run_produce.py "${ARGS[@]}"

      - name: Upload rendered files (dry-run only; also on failure for debugging)
        if: ${{ always() && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            build/**/long.mp4
            build/**/short.mp4
            build/**/thumbnail.jpg
            build/**/script.json
            build/**/captions.ass
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit state
        if: ${{ inputs.dry_run != true }}   # also true on the schedule trigger (inputs empty)
        run: |
          git config user.name "yt-autopilot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: record published videos $(date -u +%F)"
          git push
