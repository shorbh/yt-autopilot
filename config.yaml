# ---------------------------------------------------------------
# yt-autopilot configuration  (edit freely; no secrets go here)
# Secrets live in environment variables / GitHub Secrets:
#   GEMINI_API_KEY | GROQ_API_KEY | ANTHROPIC_API_KEY   (one is enough)
#   PEXELS_API_KEY                                     (optional, free)
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN    (from setup_auth.py)
# ---------------------------------------------------------------

channel:
  name: "Money Mechanics"           # change to your channel name
  id: "UCTfIJ4MK2kj57qheFd0Y9vg"    # YouTube channel ID (Studio -> Settings -> Channel -> Advanced); used for the ?sub_confirmation=1 link
  tagline: "How money actually works, explained in plain English."
  niche: "personal finance and investing explainers for a global English-speaking audience"
  audience: "adults 22-45 who want to understand money without jargon"
  language: "en-US"
  # Consistent sign-off builds brand recall (and counts as editorial identity).
  signoff: "If this saved you a mistake, subscribe - one new money mechanic every week."
  disclaimer: "This video is for education only and is not financial advice."

voice:
  provider: "auto"           # auto walks `order`; or force one of fish | elevenlabs | edge (edge always remains the safety net)
  order: ["fish", "elevenlabs", "edge"]
  # --- Fish Audio (FISH_API_KEY). s2.1-pro-free = production model at $0; word timings via Fish ASR ($0.36/audio hour) ---
  fish_model: "s2.1-pro-free"
  fish_reference_id: "97afe090973a4254b6d4e6596178a37a"      # voice id from fish.audio/app/discovery (pick an English narrator); empty = Fish's default voice
  fish_speed: 1.0
  # --- ElevenLabs (premium; free tier is refused from CI; Starter $5 = 30k credits; turbo model = 0.5 credit/char) ---
  elevenlabs_voice_id: "nPczCjzI2devNBz1zQrb"   # "Brian" — deep, warm US narrator. Browse: elevenlabs.io/voice-library
  elevenlabs_model: "eleven_turbo_v2_5"        # half the credit cost of multilingual_v2, quality is close
  elevenlabs_stability: 0.45                   # lower = more expressive, higher = more monotone
  elevenlabs_similarity: 0.8
  elevenlabs_style: 0.2
  elevenlabs_speed: 1.05
  # --- edge-tts (free fallback) ---   Run: python -m edge_tts --list-voices | findstr en-US
  name: "en-US-AndrewMultilingualNeural"   # calm male; alt: en-US-AvaMultilingualNeural, en-GB-RyanNeural
  rate: "+4%"
  pitch: "+0Hz"

video:
  width: 1920
  height: 1080
  fps: 30
  target_minutes: 8          # starting long-form length. The Sunday review ADAPTS this from retention data
  min_minutes: 7             #   (mid-video retention >= 45% -> +1 min, < 30% -> -1 min) but never outside
  max_minutes: 12            #   [min_minutes, max_minutes]. Watch hours = views x minutes watched, so length is earned.
  captions: true
  b_roll: "auto"             # auto = Pexels if PEXELS_API_KEY set, else generated slides
  music: true                # music bed from assets/music/*.mp3 (YouTube Audio Library: Ambient/Cinematic, Calm, no attribution);
  music_level: 0.10          #   silently skipped when the folder is empty. Ducks ~12 dB under speech (sidechain).
  sfx: true                  # synthesised sound design: whoosh on section change, tick when a number lands, riser into reveals
  sfx_level: 0.18
  outro: true                # 6 s end screen (subscribe CTA) after the close section

topics:
  trends: true               # scan Google News + Google Trends RSS (free, no key) before picking from the bank
  trend_min_fit: 7           # 0-10 score from the LLM; below this the evergreen bank is used
  trend_max_per_days: 7      # at most ONE trend-sourced video per this many days; the other run(s) stay evergreen
  playlists: true            # add every long video to a playlist per category (created on first use)
  # --- v4: demand-validated topics (YouTube autocomplete, free) run BEFORE the evergreen bank ---
  demand: true
  demand_seeds:              # autocomplete is queried for each; real questions people type become titles
    - "how much house can i afford"
    - "how much should i save"
    - "how much do i need to retire"
    - "is it worth it to"
    - "why is rent so expensive"
    - "why is everything so expensive"
    - "how does venmo make money"
    - "how do banks make money"
    - "how does credit score work"
    - "roth ira vs 401k"
    - "pay off debt or invest"
    - "how much car can i afford"
    - "how much is a mortgage on"
    - "what happens if you"
    - "how do rich people"
    - "why are groceries so expensive"
    - "how does inflation"
    - "how much does it cost to"
    - "should i buy a house in 2026"
    - "how to calculate"
  # --- v4: money STORIES (broad, discovery) vs MECHANICS (narrow, deep). Share drifts with the weekly review. ---
  story_share: 0.6
  story_formats:
    - "price story: why X costs what it costs — follow one dollar through the supply chain, with the numbers from the sources"
    - "business story: how X actually makes its money — revenue lines, margins, who really pays; one calculation the viewer can repeat"
    - "collapse story: how X went broke — the timeline, the decision that did it, and the household-finance lesson with numbers"
    - "then-and-now story: what X cost in a past decade vs today, adjusted for inflation and wages; what changed and why"
    - "news-hook explainer: this week's event in the first sentence, then the timeless mechanism underneath with a worked example"
  trend_queries:             # Google News searches (last 7 days, US edition)
    - "mortgage rates"
    - "Fed interest rate decision"
    - "inflation report CPI"
    - "401k OR IRA OR Roth"
    - "student loans"
    - "credit card debt"
    - "tax refund OR IRS"
    - "housing market"
    - "stock market"

shorts:
  count: 4                   # 4 per run x 2 runs = 8 Shorts/week (Shorts are this channel's discovery surface)
  width: 1080
  height: 1920
  max_seconds: 58

publishing:
  # Two long videos a week (produce.yml cron: Mon + Thu 06:00 UTC); each run's 3 Shorts fill the days between.
  timezone: "America/New_York"
  long_publish_hour: 14      # 2 PM ET = strong US daytime + India evening
  shorts_offset_days: [1, 2, 3, 4]   # Mon run -> Tue..Fri; Thu run -> Fri..Mon (two days get a second Short)
  shorts_publish_hour: 12
  privacy: "private"         # private + publishAt = scheduled. Use "public" to publish immediately.
  category_id: "27"          # 27 = Education
  made_for_kids: false
  synthetic_media_disclosure: true   # REQUIRED for AI voice under YouTube policy

llm:
  provider: "auto"           # auto | gemini | groq | anthropic
  gemini_model: "gemini-3.5-flash-lite"
  groq_model: "llama-3.3-70b-versatile"
  anthropic_model: "claude-sonnet-4-5"
  temperature: 0.8

style:
  bg_dark: "#0B1020"
  bg_dark2: "#1B2447"
  accent: "#3DDC97"
  accent2: "#FFD166"
  text: "#FFFFFF"
  font_bold: "assets/fonts/Inter-Bold.ttf"     # falls back to DejaVu / PIL default if missing
