# ---------------------------------------------------------------
# yt-autopilot configuration  (edit freely; no secrets go here)
# Secrets live in environment variables / GitHub Secrets:
#   GEMINI_API_KEY | GROQ_API_KEY | ANTHROPIC_API_KEY   (one is enough)
#   PEXELS_API_KEY                                     (optional, free)
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN    (from setup_auth.py)
# ---------------------------------------------------------------

channel:
  name: "Money Mechanics"           # change to your channel name
  id: "UCTfIJ4MK2kj57qheFd0Y9vg"    # YouTube channel ID (Studio -> Settings -> Channel -> Advanced); used for the ?sub_confirmation=1 link
  tagline: "How money actually works, explained in plain English."
  niche: "personal finance and investing explainers for a global English-speaking audience"
  audience: "adults 22-45 who want to understand money without jargon"
  language: "en-US"
  # Consistent sign-off builds brand recall (and counts as editorial identity).
  signoff: "If this saved you a mistake, subscribe - one new money mechanic every week."
  disclaimer: "This video is for education only and is not financial advice."

voice:
  # Run: python -m edge_tts --list-voices | findstr en-US
  name: "en-US-AndrewMultilingualNeural"   # calm male; alt: en-US-AvaMultilingualNeural, en-GB-RyanNeural
  rate: "+4%"
  pitch: "+0Hz"

video:
  width: 1920
  height: 1080
  fps: 30
  target_minutes: 8          # starting long-form length. The Sunday review ADAPTS this from retention data
  min_minutes: 7             #   (mid-video retention >= 45% -> +1 min, < 30% -> -1 min) but never outside
  max_minutes: 12            #   [min_minutes, max_minutes]. Watch hours = views x minutes watched, so length is earned.
  captions: true
  b_roll: "auto"             # auto = Pexels if PEXELS_API_KEY set, else generated slides
  music: false               # keep false unless you add royalty-free tracks to assets/music/
  outro: true                # 6 s end screen (subscribe CTA) after the close section

topics:
  trends: true               # scan Google News + Google Trends RSS (free, no key) before picking from the bank
  trend_min_fit: 7           # 0-10 score from the LLM; below this the evergreen bank is used
  trend_max_per_days: 7      # at most ONE trend-sourced video per this many days; the other run(s) stay evergreen
  playlists: true            # add every long video to a playlist per category (created on first use)
  trend_queries:             # Google News searches (last 7 days, US edition)
    - "mortgage rates"
    - "Fed interest rate decision"
    - "inflation report CPI"
    - "401k OR IRA OR Roth"
    - "student loans"
    - "credit card debt"
    - "tax refund OR IRS"
    - "housing market"
    - "stock market"

shorts:
  count: 3
  width: 1080
  height: 1920
  max_seconds: 58

publishing:
  # Two long videos a week (produce.yml cron: Mon + Thu 06:00 UTC); each run's 3 Shorts fill the days between.
  timezone: "America/New_York"
  long_publish_hour: 14      # 2 PM ET = strong US daytime + India evening
  shorts_offset_days: [1, 2, 3]   # Mon run -> Tue/Wed/Thu Shorts; Thu run -> Fri/Sat/Sun
  shorts_publish_hour: 12
  privacy: "private"         # private + publishAt = scheduled. Use "public" to publish immediately.
  category_id: "27"          # 27 = Education
  made_for_kids: false
  synthetic_media_disclosure: true   # REQUIRED for AI voice under YouTube policy

llm:
  provider: "auto"           # auto | gemini | groq | anthropic
  gemini_model: "gemini-3.5-flash-lite"
  groq_model: "llama-3.3-70b-versatile"
  anthropic_model: "claude-sonnet-4-5"
  temperature: 0.8

style:
  bg_dark: "#0B1020"
  bg_dark2: "#1B2447"
  accent: "#3DDC97"
  accent2: "#FFD166"
  text: "#FFFFFF"
  font_bold: "assets/fonts/Inter-Bold.ttf"     # falls back to DejaVu / PIL default if missing
